<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — SoilSense</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/"><i class="bi bi-leaf"></i><span class="brand-name">SoilSense</span></a>
        </div>
        <div class="nav-links">
            <a href="/pages/dashboard.html">Dashboard</a>
            <a href="/pages/capture.html">New Analysis</a>
            <a href="/pages/history.html">History</a>
            <a href="/pages/education.html">Learn</a>
            <a href="/pages/profile.html" class="active">Profile</a>
            <a href="/pages/admin.html" id="adminLink" style="display:none;" class="btn btn-primary"><i class="bi bi-crown"></i> Admin</a>
            <a href="#" onclick="logout()" class="btn btn-outline">Logout</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h2><i class="bi bi-person-circle"></i> My Profile</h2>
            <p class="auth-subtitle">Manage your account information</p>

            <div id="loadingMessage" class="loading-section">
                <div class="spinner"></div>
                <p>Loading profile...</p>
            </div>

            <form id="profileForm" style="display:none;">
                <!-- Display Only -->
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" readonly class="readonly-input">
                    <small>Email cannot be changed</small>
                </div>

                <!-- User Role (Display Only) -->
                <div class="form-group">
                    <label>User Role</label>
                    <input type="text" id="role" readonly class="readonly-input">
                    <small>Contact administrator to change role</small>
                </div>

                <!-- Editable Fields -->
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Farm Name</label>
                    <input type="text" id="farmName" placeholder="Enter your farm name (optional)">
                </div>

                <!-- Account Created Date -->
                <div class="form-group">
                    <label>Account Created</label>
                    <input type="text" id="createdAt" readonly class="readonly-input">
                </div>

                <!-- Buttons -->
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="bi bi-floppy"></i> Save Changes
                    </button>
                </div>

                <div id="successMessage" class="success-message" style="display:none; margin-top: 1rem;">
                    <i class="bi bi-check-circle"></i> Profile updated successfully!
                </div>

                <div id="errorMessage" class="error-message" style="display:none; margin-top: 1rem;">
                    Error updating profile
                </div>
            </form>
        </div>
    </main>

    <!-- Add custom styles for readonly inputs -->
    <style>
        .readonly-input {
            background-color: #F5F5F0 !important;
            cursor: not-allowed;
        }
    </style>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadProfile();
            setupProfileForm();
        });

        function loadProfile() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            // Show admin link if admin
            if (user.role === 'admin') {
                const adminLink = document.getElementById('adminLink');
                if (adminLink) {
                    adminLink.style.display = '';
                }
            }

            // Fetch latest profile data
            fetch('/api/auth/profile', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (response.status === 401) {
                    window.location.href = '/pages/login.html';
                    return;
                }
                return response.json();
            })
            .then(data => {
                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                // Populate form
                document.getElementById('email').value = data.email;
                document.getElementById('fullName').value = data.full_name || '';
                document.getElementById('farmName').value = data.farm_name || '';
                document.getElementById('role').value = data.role === 'admin' ? '<i class="bi bi-crown"></i> Admin' : '<i class="bi bi-person"></i> User';
                
                // Format date
                const createdDate = new Date(data.created_at).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                document.getElementById('createdAt').value = createdDate;

                // Show form, hide loading
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('profileForm').style.display = 'block';

                // Update localStorage
                const userData = JSON.parse(localStorage.getItem('user') || '{}');
                userData.full_name = data.full_name;
                userData.farm_name = data.farm_name;
                userData.role = data.role;
                localStorage.setItem('user', JSON.stringify(userData));
            })
            .catch(error => {
                console.error('Error loading profile:', error);
                alert('Failed to load profile. Please refresh the page.');
            });
        }

        function setupProfileForm() {
            const form = document.getElementById('profileForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                updateProfile();
            });
        }

        function updateProfile() {
            const token = localStorage.getItem('token');
            const fullName = document.getElementById('fullName').value.trim();
            const farmName = document.getElementById('farmName').value.trim();

            if (!fullName) {
                alert('Full name is required');
                return;
            }

            // Hide messages
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';

            fetch('/api/auth/profile', {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    full_name: fullName,
                    farm_name: farmName
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('errorMessage').style.display = 'block';
                    document.getElementById('errorMessage').innerHTML = '<i class="bi bi-exclamation-circle"></i> Error: ' + data.error;
                    return;
                }

                // Update localStorage
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                user.full_name = fullName;
                user.farm_name = farmName;
                localStorage.setItem('user', JSON.stringify(user));

                // Show success message
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 3000);
            })
            .catch(error => {
                console.error('Error updating profile:', error);
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').innerHTML = '<i class="bi bi-exclamation-circle"></i> Error updating profile';
            });
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/pages/login.html';
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/pages/login.html';
            }
        }
    </script>
</body>
</html>
